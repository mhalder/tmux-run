name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  build:
    name: Build (${{ matrix.target }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-musl
            runner: ubuntu-latest
            command: cargo
          - target: aarch64-unknown-linux-musl
            runner: ubuntu-latest
            command: cross
          - target: x86_64-apple-darwin
            runner: macos-latest
            command: cargo
          - target: aarch64-apple-darwin
            runner: macos-latest
            command: cargo
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install Rust
        uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067 # v1
        with:
          toolchain: stable
      - name: Install musl-tools
        if: matrix.target == 'x86_64-unknown-linux-musl'
        run: sudo apt-get update && sudo apt-get install -y musl-tools
      - name: Install cross
        if: matrix.command == 'cross'
        uses: taiki-e/install-action@f7e5d7c961414b23f5b25b2da9294395d08513ad # v2.87.26
        with:
          tool: cross
      - name: Add Rust target
        if: matrix.command == 'cargo'
        run: rustup target add "${{ matrix.target }}"
      - name: Build
        run: ${{ matrix.command }} build --release --locked --target "${{ matrix.target }}"
      - name: Package
        id: package
        run: |
          version="${GITHUB_REF_NAME#v}"
          staging="tmux-run-${version}-${{ matrix.target }}"
          archive="${staging}.tar.gz"
          mkdir -p "$staging"
          cp "target/${{ matrix.target }}/release/tmux-run" "$staging/"
          # LICENSE-MIT and LICENSE-APACHE must exist at the repository root.
          cp LICENSE-MIT LICENSE-APACHE README.md "$staging/"
          tar -czf "$archive" -C "$staging" tmux-run LICENSE-MIT LICENSE-APACHE README.md
          echo "archive=${archive}" >> "$GITHUB_OUTPUT"
      - name: Upload artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ steps.package.outputs.archive }}
          path: ${{ steps.package.outputs.archive }}

  release:
    name: GitHub Release
    runs-on: ubuntu-latest
    needs: build
    permissions:
      contents: write
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: artifacts
          merge-multiple: true
      - name: Generate SHA256SUMS
        working-directory: artifacts
        run: sha256sum -- *.tar.gz > SHA256SUMS
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        # This repository has no CHANGELOG.md yet, so generated notes are used.
        # When one is added, extract the section for "$GITHUB_REF_NAME" and pass
        # it via --notes-file instead.
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --verify-tag \
            --generate-notes \
            artifacts/*.tar.gz artifacts/SHA256SUMS

  publish:
    name: Publish to crates.io
    runs-on: ubuntu-latest
    needs: release
    # Trusted Publishing can only be configured for a crate you already own, so
    # 0.1.0 must be published once by hand first. The repository variable
    # CRATES_IO_PUBLISH gates this job: set it to 'true' only after the crate
    # exists on crates.io and its Trusted Publishing is wired to this workflow's
    # `release` environment.
    if: vars.CRATES_IO_PUBLISH == 'true'
    environment: release
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Authenticate with crates.io
        id: auth
        uses: rust-lang/crates-io-auth-action@c6f97d42243bad5fab37ca0427f495c86d5b1a18 # v1.0.5
      - name: Publish
        run: cargo publish --locked
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
